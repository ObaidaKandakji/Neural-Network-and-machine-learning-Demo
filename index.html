<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Self-driving car - No libraries</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="carCanvas"></canvas>
    <div id="sidePanel">
        <div id="verticalButtons">
            <button onclick="save()" aria-label="Save best brain">Save</button>
            <button onclick="discard()" aria-label="Discard saved brain">Reset</button>
        </div>
        <div id="statusPanel" aria-live="polite">
            <div class="statusRow">
                <span>Generation</span>
                <span id="generationValue">1</span>
            </div>
            <div class="statusRow">
                <span>Active cars</span>
                <span id="activeCarsValue">0</span>
            </div>
            <div class="statusRow">
                <span>Best fitness</span>
                <span id="bestFitnessValue">0</span>
            </div>
            <div class="statusRow">
                <span>Best passes</span>
                <span id="bestPassesValue">0</span>
            </div>
            <div class="statusRow">
                <span>Best ever</span>
                <span id="bestEverScoreValue">N/A</span>
            </div>
        </div>
    </div>
    <canvas id="networkCanvas"></canvas>
    <script src="visualizer.js"></script>
    <script src="network.js"></script>
    <script src="sensor.js"></script>
    <script src="utils.js"></script>
    <script src="road.js"></script>
    <script src="controls.js"></script>
    <script src="car.js"></script>
    <script src="main.js"></script>
</body>
</html>
